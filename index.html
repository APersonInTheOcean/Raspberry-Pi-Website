<html>
    <head>
  <meta charset="UTF-8">
  <title>Simple Forum</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .forum {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
    }

    .post {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }

    .author {
      font-weight: bold;
    }

    .content {
      margin: 5px 0 10px;
    }

    .reply {
      margin-left: 20px;
      background: #f9f9f9;
      padding: 8px;
      border-radius: 5px;
    }

    textarea, input {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
    <h1></h1>
    <p></p>
   
    <img src="camila.jpg" alt="Description of the image">
</body>
</html>
