<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Forum</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .forum {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
    }

    .post {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }

    .author {
      font-weight: bold;
    }

    .content {
      margin: 5px 0 10px;
    }

    .reply {
      margin-left: 20px;
      background: #f9f9f9;
      padding: 8px;
      border-radius: 5px;
    }

    textarea, input {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="forum">
  <h1>🗨️ Simple Forum</h1>

  <div id="posts"></div>

  <h3>New Post</h3>
  <input id="username" placeholder="Your name">
  <textarea id="message" placeholder="Write your post..."></textarea>
  <button onclick="addPost()">Post</button>
</div>

<script>
  function addPost() {
    const user = document.getElementById("username").value;
    const msg = document.getElementById("message").value;
    if (!user || !msg) return alert("Fill in both fields!");

    const post = document.createElement("div");
    post.className = "post";
    post.innerHTML = `
      <div class="author">${user}</div>
      <div class="content">${msg}</div>
      <textarea placeholder="Reply..."></textarea>
      <button onclick="reply(this)">Reply</button>
      <div class="replies"></div>
    `;

    document.getElementById("posts").prepend(post);
    document.getElementById("message").value = "";
  }

  function reply(btn) {
    const textarea = btn.previousElementSibling;
    if (!textarea.value) return;

    const reply = document.createElement("div");
    reply.className = "reply";
    reply.textContent = textarea.value;

    btn.nextElementSibling.appendChild(reply);
    textarea.value = "";
  }
</script>

</body>
</html>
